# base config
seed: 17771
device: 'cuda' # 'cuda'
num_workers: 6

lr: 0.0005
lr_drop: 400
wd: 0.0001
n_epoch: 150
bsz: 1028
eval_bsz: 2000
grad_clip: 0.1
max_windows: 5
clip_length: 1
eval_epoch_interval: 1

position_embedding: "sine_adaptive"      # "sine", "v2", "learned", "rope", or "conv"
enc_layers: 2
dec_layers: 2
dim_feedforward: 1024
hidden_dim: 256
input_dropout: 0.5
dropout: 0.1
nheads: 8
num_queries: 10

n_input_proj: 2
saliency_margin: 0.2
span_loss_type: "l1"            # "l1" (L1 Loss) or "ce" (Cross Entropy Loss)
set_cost_span: 10
set_cost_giou: 1
set_cost_class: 4
span_loss_coef: 10
giou_loss_coef: 1
label_loss_coef: 4
eos_coef: 0.1
lw_saliency: 1

ckpt_filename: best_checkpoint.pth
train_log_filename: train.log
eval_log_filename: val.log
eval_split_name: val            # "val", "test", or "private"
aux_loss: True

model_ema: True
ema_decay: 0.9
results_dir: results_pretraining

# Weights & Biases Logging configuration
wandb_project: "DCASE2026 - LCS-DETR"
wandb_run_name: "lcs_detr_enhanced"
log_interval: 10              # Log training metrics every N steps/iterations

# clotho-moment-specific config
dset_name: clotho-moment_castella
clip_length: 1
train_path: ../world_dataset/preprocessed/world_train_release.jsonl
val_path: ../world_dataset/preprocessed/world_val_release.jsonl
test_path: ../world_dataset/preprocessed/world_test_release.jsonl
submission_path: private/dcase2026_private.jsonl
max_q_l: 32
max_a_l: 300

# feature-specific config 
ctx_mode: audio_tef             # "audio", "tef", or "audio_tef" (Temporal Embeddings)
a_feat_dir: ../world_dataset/features/clap
t_feat_dir: ../world_dataset/features/clap_text
a_sub_feat_dir: private/feature/clap
t_sub_feat_dir: private/feature/clap_text
a_feat_type: clap
t_feat_type: clap
a_feat_dim: 768
t_feat_dim: 768

model_name: lcs_detr

# Optimization and variant configurations
use_amp: True                   # True/False: Enables bfloat16 Automatic Mixed Precision to save VRAM and speed up training
use_compile: False               # True/False: Enables torch.compile for graph optimization (faster training, slower startup)
use_focal_loss: True            # True/False: Uses Focal Loss instead of Cross-Entropy for the Hungarian matcher (recommended)
use_flash_attention: False       # True/False: Enables FlashMultiheadAttention (requires NVIDIA GPU and flash-attn package)
lr_scheduler_type: "cosine"     # "cosine" (CosineAnnealingLR) or "step" (StepLR)
use_saliency_conv: true